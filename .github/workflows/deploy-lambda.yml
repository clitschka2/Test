name: Deploy to AWS Lambda

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION_NAME: my-example-lambda
  DATADOG_SITE: datadoghq.com  # Cambia si usas otro sitio (datadoghq.eu, etc)

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          echo "Running tests..."
          # pytest tests/ --cov=.

  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production  # ← Especifica el environment aquí

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t package/

      - name: Copy Lambda function
        run: |
          cp lambda_function.py package/

      - name: Create deployment package
        run: |
          cd package
          zip -r ../lambda-deployment.zip .
          cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --zip-file fileb://lambda-deployment.zip

      - name: Wait for function update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

      - name: Configure Datadog Lambda Layers and Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --layers \
              "arn:aws:lambda:${{ env.AWS_REGION }}:464622532012:layer:Datadog-Python311:115" \
              "arn:aws:lambda:${{ env.AWS_REGION }}:464622532012:layer:Datadog-Extension:86" \
            --environment "Variables={
              DD_SITE=${{ env.DATADOG_SITE }},
              DD_API_KEY=${{ secrets.DATADOG_API_KEY }},
              DD_TRACE_ENABLED=true,
              DD_SERVICE=${{ env.LAMBDA_FUNCTION_NAME }},
              DD_ENV=production,
              DD_LOGS_INJECTION=true,
              DD_SERVERLESS_LOGS_ENABLED=true,
              DD_CAPTURE_LAMBDA_PAYLOAD=true
            }"

          echo "Waiting for Datadog configuration update..."
          aws lambda wait function-updated \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }}

      - name: Capture deployment start time
        id: deploy-start
        run: |
          echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Publish new version
        id: publish-version
        run: |
          VERSION=$(aws lambda publish-version \
            --function-name ${{ env.LAMBDA_FUNCTION_NAME }} \
            --query 'Version' \
            --output text)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Published version: $VERSION"

      - name: Install Datadog CI
        run: |
          npm install -g @datadog/datadog-ci

      - name: Send deployment event to Datadog
        env:
          DD_BETA_COMMANDS_ENABLED: 1
          DD_API_KEY: ${{ secrets.DATADOG_API_KEY }}
          DD_SITE: ${{ env.DATADOG_SITE }}
        run: |
          datadog-ci dora deployment \
            --service ${{ env.LAMBDA_FUNCTION_NAME }} \
            --env production \
            --version ${{ steps.publish-version.outputs.version }} \
            --started-at ${{ steps.deploy-start.outputs.timestamp }} \
            --finished-at $(date +%s) \
            --git-repository-url ${{ github.repositoryUrl }} \
            --git-commit-sha ${{ github.sha }}

      - name: Deployment successful
        run: |
          echo "✅ Lambda function deployed successfully!"
          echo "Function: ${{ env.LAMBDA_FUNCTION_NAME }}"
          echo "Region: ${{ env.AWS_REGION }}"
          echo "Version: ${{ steps.publish-version.outputs.version }}"
          echo "📊 DORA metrics sent to Datadog"
